[workspace]
members = [
    "crates/orion-core",
    "crates/orion-ipc",
    "crates/oriond",
    "crates/orion-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
authors = ["Atlas Research Labs <dev@atlasresearchlabs.online>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/AtlasResearch-Labs/Orionpm"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# IPC (cross-platform: UDS on Unix, Named Pipes on Windows)
interprocess = { version = "2", features = ["tokio"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# System metrics (real OS data, no mocking)
sysinfo = "0.30"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Service installer (systemd / launchd / Windows SCM)
service-manager = "0.7"

# File watch for --watch mode
notify = "6"

# Alerts: email
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
] }

# Alerts: webhook
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# TUI
ratatui = "0.27"
crossterm = "0.27"
